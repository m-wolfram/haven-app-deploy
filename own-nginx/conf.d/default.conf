# Own nginx only (docker-compose.own-nginx.yml): what the site config nginx/*.conf expects from the
# main config. An external nginx provides the same itself and does not read this file

# Docker DNS: container addresses are re-read after the containers are recreated
resolver 127.0.0.11 valid=10s;

server_tokens off;

# Requests for other names (a foreign Host, a bare IP): close the connection. Let's Encrypt check
# is answered for any name
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
